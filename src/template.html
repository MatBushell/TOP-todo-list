<body>
    <div class="appContainer">
        <header class="navContainer">
            <h1>Tasks</h1>
            <ul class="nav">
                <li class="newProject" id="create-project">+ New list</li>
            </ul>
        </header>
        <div class="content"></div>
        <button type="button" class="addTaskButton material-symbols-outlined">add</button>
    </div>

    <dialog class="addProjectDialog" id="addProjectDialog" closedby="any">
        <form id="addProjectForm" method="dialog">
            <div class="addProjectHeader">
                <div class="cancelAndTitle">
                    <button type="button" class="canelNewProject material-symbols-outlined">close</button>
                    <div class="createNewListHeading">Create new list</div>
                </div>
                <button type="button" class="saveNewProject">Done</button>
            </div>
            <input type="text" id="newProjectTitle" required minlength="1" maxlength="100" placeholder="Enter list title">
        </form>
    </dialog>

    <dialog class="addTaskDialog" id="addTaskDialog" closedby="any">
        <form id="addTaskForm" method="dialog">
            <!--Move Task Popover-->
            <!-- <button type="button" class="moveTaskContainer" popovertarget="moveTaskPopover">
                <div class="moveTask">My Tasks</div>

            </button> -->
            <!-- <div popover id="moveTaskPopover"><span class="moveTaskPopoverTitle">Move task to</span>
                <ul class="popoverProjectList"></ul>
            </div> -->

            <!-- Task parameters -->
            <textarea name="taskTitle" id="" class="taskTitleTextbox" placeholder="New Task"></textarea>
            <div class="taskParametersContainer">
                <div class="detailsCalStar">
                    <button type="button" class="material-symbols-outlined">notes</button>
                    <button type="button" class="material-symbols-outlined">schedule</button>
                    <button type="button" class="material-symbols-outlined">star</button>
                </div>
                <button type="submit">Save</button>
            </div>
        </form>
    </dialog>
